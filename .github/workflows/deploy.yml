name: Deploy to hosting (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site into dist/
        run: node build.js

      - name: Include web.config
        run: cp web.config dist/web.config

      - name: Upload dist/ to the site folder over FTP (curl)
        env:
          FTP_PASSWORD: ${{ secrets.KAZI }}
        run: |
          set -e
          cd dist
          find . -type f | sed 's|^\./||' | while read -r f; do
            echo "uploading $f"
            curl --silent --show-error --fail --ftp-create-dirs \
              --user "kazi:$FTP_PASSWORD" -T "$f" "ftp://win8232.site4now.net/$f"
          done
          echo "Upload finished"
