name: Deploy to hosting (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site into dist/
        run: node build.js

      - name: Include web.config
        run: cp web.config dist/web.config

      - name: Upload dist/ to the site folder over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: win8232.site4now.net
          username: kazi
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          protocol: ftp
